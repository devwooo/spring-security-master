<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f6f8;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 360px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .login-container h1 {
            margin: 0 0 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #4338ca;
        }

        .error {
            margin-bottom: 16px;
            padding: 10px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 6px;
            font-size: 14px;
        }

        .logout {
            margin-bottom: 16px;
            padding: 10px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h1>로그인</h1>

    <div th:if="${param.error}" class="error">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <div th:if="${param.logout}" class="logout">
        로그아웃되었습니다.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="username">아이디</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="아이디를 입력하세요"
                    required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="비밀번호를 입력하세요"
                    required>
        </div>

        <button type="submit" class="login-button">
            로그인
        </button>

    </form>
</div>

</body>
</html>
